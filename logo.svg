<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Open Source Music Theory Codex</title>
  <desc id="desc">
    Circular logo combining music notation and code symbols, representing the Music Theory Codex.
  </desc>

  <!-- Background -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="noteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#f9fafb" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgGradient)" rx="32" ry="32" />

  <!-- Outer ring -->
  <circle
    cx="256"
    cy="256"
    r="200"
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-dasharray="4 14"
    opacity="0.9"
  />

  <!-- Inner soft ring -->
  <circle
    cx="256"
    cy="256"
    r="150"
    fill="none"
    stroke="#0f172a"
    stroke-width="40"
    opacity="0.8"
  />

  <!-- Staff lines -->
  <g transform="translate(96, 190) rotate(-10, 160, 40)" opacity="0.9">
    <line x1="0" y1="0" x2="320" y2="0" stroke="#1f2937" stroke-width="4" />
    <line x1="0" y1="12" x2="320" y2="12" stroke="#1f2937" stroke-width="4" />
    <line x1="0" y1="24" x2="320" y2="24" stroke="#1f2937" stroke-width="4" />
    <line x1="0" y1="36" x2="320" y2="36" stroke="#1f2937" stroke-width="4" />
    <line x1="0" y1="48" x2="320" y2="48" stroke="#1f2937" stroke-width="4" />
  </g>

  <!-- Code angle brackets over staff -->
  <g transform="translate(140, 165) rotate(-8, 120, 80)" opacity="0.95">
    <!-- Left bracket "<" -->
    <polyline
      points="20,80 60,40 60,120"
      fill="none"
      stroke="#38bdf8"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right bracket ">" -->
    <polyline
      points="220,40 220,120 260,80"
      fill="none"
      stroke="#a855f7"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Stylized note -->
  <g transform="translate(210, 190)">
    <!-- Stem -->
    <rect
      x="30"
      y="-40"
      width="10"
      height="90"
      rx="5"
      fill="url(#noteGradient)"
      opacity="0.95"
    />
    <!-- Head -->
    <ellipse
      cx="35"
      cy="35"
      rx="26"
      ry="20"
      fill="url(#noteGradient)"
      transform="rotate(-18 35 35)"
    />
    <!-- Small accent glow -->
    <circle cx="50" cy="15" r="8" fill="#38bdf8" opacity="0.85" />
  </g>

  <!-- Text: MTC -->
  <text
    x="256"
    y="360"
    text-anchor="middle"
    fill="#e5e7eb"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
    font-size="40"
    letter-spacing="6"
  >
    MTC
  </text>

  <!-- Subtitle -->
  <text
    x="256"
    y="396"
    text-anchor="middle"
    fill="#9ca3af"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif"
    font-size="16"
    letter-spacing="2"
  >
    MUSIC THEORY CODEX
  </text>
</svg>
